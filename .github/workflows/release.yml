name: Draft VSIX release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.1.4
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and tag target
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Expected a stable vX.Y.Z tag' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -cne "v$version") { throw 'The tag must match package.json version' }
          $tagCommit = git rev-parse --verify "$tag^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Version tag is missing' }
          $headCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $headCommit) { throw 'Checkout is not the tagged commit' }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm run build:backend
      - run: npm test
      - run: npm run licenses:audit
      - run: npm run package
      - name: Verify packaged runtime and legal files
        shell: pwsh
        run: ./tools/verify-package.ps1 -SkipExample
      - name: Prepare checksums and release notes
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $version = $env:RELEASE_VERSION
          $package = "releases/step7project-$version.vsix"
          if (!(Test-Path -LiteralPath $package)) { throw 'Expected VSIX was not built' }
          $hash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  step7project-$version.vsix" | Set-Content releases/SHA256SUMS.txt -Encoding utf8NoBOM
          $pattern = '(?ms)^## ' + [regex]::Escape($version) + '[^\r\n]*\r?\n(.*?)(?=^## |\z)'
          $section = [regex]::Match((Get-Content CHANGELOG.md -Raw), $pattern)
          if (!$section.Success) { throw 'Add a versioned English changelog section before tagging' }
          $section.Groups[1].Value.Trim() | Set-Content releases/RELEASE-NOTES.md -Encoding utf8NoBOM
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.version.outputs.version }}
          path: |
            releases/*.vsix
            releases/SHA256SUMS.txt
            releases/RELEASE-NOTES.md
          if-no-files-found: error
          retention-days: 14

  draft:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.build.outputs.version }}
          path: artifacts
      - name: Create draft without replacing existing releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum --check SHA256SUMS.txt
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo 'A release already exists for this tag; no assets will be replaced.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --repo "$GH_REPO" --verify-tag --draft \
            --title "Step7Project $RELEASE_TAG" --notes-file RELEASE-NOTES.md \
            ./*.vsix SHA256SUMS.txt
