name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm run build:backend
      - run: npm test
      - run: npm run licenses:audit
      - name: Check generated localization files
        shell: pwsh
        run: |
          $changes = git status --porcelain --untracked-files=all -- package.json 'package.nls*.json' language/generated.json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect generated files' }
          if ($changes) { throw 'Commit the output of npm run languages:generate' }
